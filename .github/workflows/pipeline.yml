name: F1 Data Engineering Pipeline

# Este workflow NO ingesta. La fuente de timing de la F1 (livetiming.formula1.com)
# devuelve 403 a las IPs de los runners de GitHub: está verificado en el log de
# la corrida #25 y se puede volver a comprobar con src/diagnostico_fuente.py.
#
# Por eso la ingesta corre en una máquina con IP de casa, que sí pasa, y sube el
# silver al bucket. De ahí para arriba —entrenar, predecir, catálogo— no hace
# falta la fuente: todo sale de S3, y eso sí vive acá.
#
# El flujo local, antes de disparar esto:
#     python src/ingesta_carreras.py
#     python src/transformacion_carrera.py
#     python src/sincronizar_s3.py --que silver

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Temporada cuya era entrenar (2024/2025 van juntas, 2026 aparte)"
        required: false
        default: "2026"
  schedule:
    # Lunes 12:00 UTC (09:00 ART). Las carreras corren el domingo.
    #
    # GitHub deshabilita el schedule de un repo público tras 60 días sin
    # actividad. Si el pipeline deja de correr solo, revisar la pestaña
    # Actions: el workflow aparece pausado con un botón para reactivarlo.
    - cron: "0 12 * * 1"

# Si se dispara dos veces seguidas, la corrida vieja se cancela en vez de
# pelearse por las mismas particiones de S3.
concurrency:
  group: f1-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      F1_YEAR: ${{ github.event.inputs.year || '2026' }}
      BUCKET: s3://f1-telemetry-datalake-gabriel
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Tiene que ser la misma minor del venv local: numpy 2.5 y xgboost 3.3
      # no publican ruedas por debajo de 3.12, y el runner venia en 3.10.
      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar sistema de archivos
        run: mkdir -p data/cache data/silver data/gold models

      # Sin "|| true" a propósito. Si la bajada falla, abajo se entrena sobre
      # una carpeta vacía o a medias y se publican métricas calculadas sobre
      # datos que no son los del lake. Que rompa acá es el comportamiento
      # correcto: es el único momento en que el error todavía se ve.
      #
      # - laps: el modelo se entrena con la temporada completa.
      # - gold: predicciones.py conserva las predicciones de las otras eras y
      #   reemplaza solo las suyas; si el archivo no está, las borra.
      #
      # silver/telemetry NO se baja: es más de 1 GB y el catálogo lista sus
      # particiones directamente de S3 (F1_FUENTE=s3).
      - name: Traer silver y gold desde S3
        run: |
          aws s3 sync $BUCKET/data/silver/laps ./data/silver/laps --no-progress
          aws s3 sync $BUCKET/data/gold ./data/gold --no-progress

      - name: Verificar que el silver llegó
        run: |
          archivos=$(find data/silver/laps -name "*.parquet" | wc -l)
          echo "Parquets de vueltas descargados: $archivos"
          if [ "$archivos" -eq 0 ]; then
            echo "ERROR: silver/laps vino vacío. No se entrena sobre la nada."
            exit 1
          fi

      # El modelo se entrena por era reglamentaria: 2024 y 2025 comparten
      # autos, desde 2026 hay reglamento nuevo. Mezclarlas promedia dos
      # comportamientos de degradación que no tienen por qué parecerse.
      - name: Entrenar modelo y predecir estrategia
        run: |
          if [ "$F1_YEAR" -ge 2026 ]; then
            export F1_YEARS="2026"
          else
            export F1_YEARS="2024,2025"
          fi
          echo "Era a entrenar: $F1_YEARS"
          python src/entrenamiento_modelo.py
          python src/predicciones.py

      # Lista las particiones de telemetría directo del bucket, sin bajarlas.
      # Sin este paso los datos llegan a S3 pero el dashboard no los muestra,
      # porque sus selectores salen del catálogo.
      - name: Regenerar catálogo (Gold Layer)
        env:
          F1_FUENTE: s3
          F1_BUCKET: f1-telemetry-datalake-gabriel
        run: python src/catalogo.py

      - name: Verificar salida
        run: |
          echo "--- gold ---"
          ls -la data/gold
          echo "--- modelos ---"
          ls -la models
          echo "--- carreras con datos en el catálogo ---"
          python -c "import json;c=json.load(open('data/gold/catalogo.json'));print(sum(1 for x in c['circuitos'] if x['tiene_datos']),'de',len(c['circuitos']))"

      # Solo lo que este workflow produce. El silver lo sube la máquina que
      # ingesta, no este job.
      - name: Sincronizar gold y modelos a S3
        run: |
          aws s3 sync ./data/gold $BUCKET/data/gold --no-progress
          aws s3 sync ./models $BUCKET/models --no-progress
