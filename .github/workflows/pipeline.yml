name: F1 Data Engineering Pipeline

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Temporada a procesar"
        required: false
        default: "2026"
      gps:
        description: "Circuitos separados por coma (vacío = todo el calendario corrido)"
        required: false
        default: ""
  schedule:
    # Lunes 12:00 UTC (09:00 ART). Las carreras corren el domingo.
    #
    # GitHub deshabilita el schedule de un repo público tras 60 días sin
    # actividad. Si el pipeline deja de correr solo, revisar la pestaña
    # Actions: el workflow aparece pausado con un botón para reactivarlo.
    - cron: "0 12 * * 1"

# Si se dispara dos veces seguidas, la corrida vieja se cancela en vez de
# pelearse por las mismas particiones de S3.
concurrency:
  group: f1-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Alto a propósito: una corrida semanal con el cache de FastF1 caliente
    # tarda minutos, pero la primera —o un backfill de temporada entera—
    # descarga cada sesión de cero. Es un tope de seguridad, no un objetivo.
    timeout-minutes: 330

    env:
      F1_YEAR: ${{ github.event.inputs.year || '2026' }}
      F1_GPS: ${{ github.event.inputs.gps || '' }}
      BUCKET: s3://f1-telemetry-datalake-gabriel
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Tiene que ser la misma minor del venv local: numpy 2.5 y xgboost 3.3
      # no publican ruedas por debajo de 3.12, y el runner venia en 3.10.
      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Sin esto, cada corrida vuelve a bajar la sesión entera de la API de
      # timing. Es la diferencia entre minutos y decenas de minutos.
      - name: Restaurar cache de FastF1
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fastf1-${{ env.F1_YEAR }}-${{ github.run_id }}
          restore-keys: |
            fastf1-${{ env.F1_YEAR }}-
            fastf1-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar sistema de archivos
        run: mkdir -p data/cache data/raw data/silver data/gold models

      # Dos descargas, las dos chicas y las dos necesarias:
      #
      # - laps: el modelo se entrena con la temporada completa. Sin esto
      #   aprendería solo de la carrera del fin de semana.
      # - gold: predicciones.py conserva las predicciones de las otras eras y
      #   reemplaza solo las suyas; si el archivo no está, las borra. Y
      #   catalogo.py reusa de ahí las calidades de posición ya medidas.
      #
      # silver/telemetry NO se baja: son más de 1 GB y el catálogo lista sus
      # particiones directamente de S3 (F1_FUENTE=s3).
      - name: Traer silver y gold existentes desde S3
        run: |
          aws s3 sync $BUCKET/data/silver/laps ./data/silver/laps --no-progress || true
          aws s3 sync $BUCKET/data/gold ./data/gold --no-progress || true

      - name: Ingesta (Bronze Layer)
        run: python src/ingesta_carreras.py

      - name: Transformación (Silver Layer)
        run: python src/transformacion_carrera.py

      # El modelo se entrena por era reglamentaria: 2024 y 2025 comparten
      # autos, desde 2026 hay reglamento nuevo. Mezclarlas promedia dos
      # comportamientos de degradación que no tienen por qué parecerse.
      #
      # Sin exportar F1_YEARS, los scripts usan su default (2024,2025) y el
      # pipeline terminaría ingiriendo 2026 pero entrenando la era vieja.
      - name: Entrenar modelo y predecir estrategia
        run: |
          if [ "$F1_YEAR" -ge 2026 ]; then
            export F1_YEARS="2026"
          else
            export F1_YEARS="2024,2025"
          fi
          echo "Era a entrenar: $F1_YEARS"
          python src/entrenamiento_modelo.py
          python src/predicciones.py

      # Va después de la transformación: el catálogo tiene que ver la carrera
      # nueva ya particionada. Sin este paso los datos llegan a S3 pero el
      # dashboard no los muestra, porque sus selectores salen de acá.
      - name: Regenerar catálogo (Gold Layer)
        env:
          F1_FUENTE: s3
          F1_BUCKET: f1-telemetry-datalake-gabriel
        run: python src/catalogo.py

      - name: Verificar salida
        run: |
          echo "--- silver/telemetry generado en esta corrida ---"
          find data/silver/telemetry -name "*.parquet" | head -20
          echo "--- gold ---"
          ls -la data/gold || echo "sin gold"
          echo "--- carreras con datos en el catálogo ---"
          python -c "import json;c=json.load(open('data/gold/catalogo.json'));print(sum(1 for x in c['circuitos'] if x['tiene_datos']),'de',len(c['circuitos']))"
          echo "--- peso ---"
          du -sh data/raw data/silver data/gold models

      # Sólo silver, gold y modelos. El bronze y el cache se quedan en el
      # runner: son intermedios y el cache pesa más que todo lo demás junto.
      - name: Sincronizar a S3
        run: |
          aws s3 sync ./data/silver $BUCKET/data/silver --no-progress \
            --exclude "*.crc" --exclude "*_SUCCESS"
          aws s3 sync ./data/gold $BUCKET/data/gold --no-progress
          aws s3 sync ./models $BUCKET/models --no-progress
